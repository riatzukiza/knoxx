name: Install Knoxx verification toolchain
description: Build the pinned SDK and install packages without deployment credentials
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: DeLaGuardo/setup-clojure@13
      with:
        cli: '1.12.5.1654'
        clj-kondo: '2025.07.28'
    - uses: pnpm/action-setup@v4
      with:
        version: 10.20.0
    - uses: actions/setup-node@v5
      with:
        node-version: '24'
    - name: Prepare the explicit native-error test evaluator
      shell: bash
      run: |
        set -euo pipefail
        bundle="$RUNNER_TEMP/knoxx-native-error-evaluator-bundle"
        node scripts/native-error-static-evaluator.mjs collect "$bundle"
        evaluator="$(node scripts/native-error-static-evaluator.mjs restore "$bundle" "$RUNNER_TEMP/knoxx-native-error-evaluator")"
        printf 'KNOXX_NATIVE_ERROR_KONDO=%s\n' "$evaluator" >> "$GITHUB_ENV"
    - uses: actions/checkout@v5
      with:
        repository: open-hax/openplanner
        ref: 07085d6557b75834ce6f50e6c54b8ca47e1c7c08
        path: _deps/openplanner
        persist-credentials: false
    - name: Prepare the pinned OpenPlanner SDK and install Knoxx
      shell: bash
      run: |
        set -euo pipefail
        sibling="$GITHUB_WORKSPACE/../openplanner"
        if [[ -e "$sibling" && ! -L "$sibling" ]]; then
          printf 'Refusing an existing real OpenPlanner sibling; preserve it and choose an owned workspace.\n' >&2
          exit 1
        fi
        sdk="$(bash scripts/build-sandbox-openplanner-sdk.sh prepare --source "$GITHUB_WORKSPACE/_deps/openplanner" --run-root "$RUNNER_TEMP/knoxx-setup-sdk")"
        ln -sfn "$sdk" "$GITHUB_WORKSPACE/../openplanner"
        pnpm install --frozen-lockfile
        pnpm -C backend install --frozen-lockfile
        pnpm -C frontend install --frozen-lockfile
