name: Service Environment Promotion
on:
  pull_request_target:
    types: [labeled, synchronize, reopened, closed]
    branches: [main]
    # Controller-pin/provenance maintenance does not change deployable application artifacts.
    paths-ignore:
      - '.github/workflows/environment-promotion.yml'
      - '.ημ/**'
permissions:
  contents: read
  pull-requests: read
jobs:
  testing:
    if: >-
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'testing')
    uses: open-hax/services/.github/workflows/deploy-service-environment.yml@48c9cc252341d49b7d0e3b5ed20b774ca66e55d4
    secrets:
      PROMETHEAN_ENVIRONMENT_SSH_KEY: ${{ secrets.PROMETHEAN_ENVIRONMENT_SSH_KEY }}
    with:
      controller_sha: 48c9cc252341d49b7d0e3b5ed20b774ca66e55d4
      service: knoxx
      environment: testing
      pull_request: ${{ format('{0}', github.event.pull_request.number) }}
  staging:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    uses: open-hax/services/.github/workflows/deploy-service-environment.yml@48c9cc252341d49b7d0e3b5ed20b774ca66e55d4
    secrets:
      PROMETHEAN_ENVIRONMENT_SSH_KEY: ${{ secrets.PROMETHEAN_ENVIRONMENT_SSH_KEY }}
    with:
      controller_sha: 48c9cc252341d49b7d0e3b5ed20b774ca66e55d4
      service: knoxx
      environment: staging
      pull_request: ${{ format('{0}', github.event.pull_request.number) }}
