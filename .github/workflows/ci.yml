name: Mutation source reader owning suite (QA only)

on:
  workflow_dispatch:
    inputs:
      comparison_base_sha:
        required: true
        default: "fde4d2381345174869530abc9bb05b6c5c053e5b"
      migration_infrastructure:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mutation-reader-owning-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: dbb3b1db3d66381069e0f2268230b754fd0e3a90
      EXPECTED_TREE: 1bc8d4a4e02c9ab5cbded25ca83485ec49f92f76
    steps:
      - name: Check out the exact test-only application source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: dbb3b1db3d66381069e0f2268230b754fd0e3a90
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Set up pinned Clojure
        uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08
        with:
          cli: "1.12.5.1654"
      - name: Bind actual source and unchanged canonical adapter
        shell: bash
        run: |
          python3 - <<'PRE'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mutation-reader-proof'
          proof.mkdir()
          def git(*args):
              p = subprocess.run(['git', '-C', str(root), *args], capture_output=True, timeout=30)
              assert p.returncode == 0 and not p.stderr
              return p.stdout
          observed = {'source': git('rev-parse', 'HEAD').decode().strip(),
                      'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
                      'statusHex': git('status', '--porcelain=v1', '-z', '--untracked-files=all').hex(),
                      'QAWorkflowSource': os.environ['GITHUB_SHA'],
                      'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          adapter = root / 'backend/scripts/run-mutation-process.py'
          observed['adapterSHA256'] = hashlib.sha256(adapter.read_bytes()).hexdigest()
          (proof / 'pre-source.json').write_text(json.dumps(observed, indent=2) + '\n')
          assert observed['source'] == os.environ['EXPECTED_SOURCE']
          assert observed['tree'] == os.environ['EXPECTED_TREE'] and observed['statusHex'] == ''
          assert observed['adapterSHA256'] == '899fbac9de15e8603cb21b52835fe44f068fe118e76988c67b8c1784abaf39d5'
          PRE
      - name: Run the unchanged registered full mutation-test suite
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python3 scripts/run-mutation-process.py \
            --timeout-ms 600000 --max-output-bytes 8388608 --cleanup-ms 30000 \
            -- clojure -M:mutation-test > "$RUNNER_TEMP/mutation-reader-proof/unit-native.json"
          python3 - <<'UNIT'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mutation-reader-proof/unit-native.json'
          result = json.loads(p.read_bytes())
          print(result['output'])
          assert result['termination'] == 'exited' and result['cleanup-complete?']
          assert not result['capture-truncated?']
          assert result['exit-code'] == 0, 'The actual owning suite failed; native capture retained unchanged.'
          UNIT
      - name: Preserve actual final source custody
        if: always()
        shell: bash
        run: |
          python3 - <<'POST'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mutation-reader-proof'
          proof.mkdir(exist_ok=True)
          observed = {}
          for label, args in [('source', ['rev-parse', 'HEAD']), ('tree', ['rev-parse', 'HEAD^{tree}']),
                              ('status', ['status', '--porcelain=v1', '-z', '--untracked-files=all']),
                              ('index', ['diff', '--cached', '--binary']), ('diff', ['diff', '--binary'])]:
              p = subprocess.run(['git', '-C', str(root), *args], capture_output=True, timeout=30)
              observed[label] = {'exit': p.returncode, 'stdoutBytes': len(p.stdout),
                                 'stdoutSHA256': hashlib.sha256(p.stdout).hexdigest(), 'stderrBytes': len(p.stderr)}
              if label in ['source', 'tree']: observed[label]['value'] = p.stdout.decode().strip()
          (proof / 'post-source.json').write_text(json.dumps(observed, indent=2) + '\n')
          assert all(v['exit'] == 0 and v['stderrBytes'] == 0 for v in observed.values())
          assert observed['source']['value'] == os.environ['EXPECTED_SOURCE']
          assert observed['tree']['value'] == os.environ['EXPECTED_TREE']
          assert all(observed[k]['stdoutBytes'] == 0 for k in ['status', 'index', 'diff'])
          POST
      - name: Bound the explicit finite unit evidence
        id: unit_proof
        if: always()
        shell: bash
        run: |
          python3 - <<'SIZE'
          import hashlib, json, os, pathlib, stat
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mutation-reader-proof'
          proof.mkdir(exist_ok=True)
          allowed = {'pre-source.json', 'unit-native.json', 'post-source.json'}
          rows = []
          total = 0
          for p in proof.iterdir():
              assert len(rows) < 3, 'Unexpected extra evidence entry'
              info = p.lstat()
              assert p.name in allowed and stat.S_ISREG(info.st_mode)
              total += info.st_size
              assert total + 65536 <= 64 * 1024**2
              rows.append({'name': p.name, 'bytes': info.st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          out = {'scope': 'Full owning unit suite only; no genuine kill/model/runtime/release credit.',
                 'rawBytes': total, 'files': rows, 'missing': sorted(allowed - {v['name'] for v in rows})}
          (proof / 'artifact-admission.json').write_text(json.dumps(out, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('admissible=true\n')
          SIZE
      - name: Preserve actual finite unit and source evidence
        if: always() && steps.unit_proof.outputs.admissible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-reader-owning-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-reader-proof/
          if-no-files-found: error
          retention-days: 1
      - name: Preserve a bounded diagnostic when complete proof is inadmissible
        if: always() && steps.unit_proof.outputs.admissible != 'true'
        shell: bash
        run: |
          python3 - <<'DIAG'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mutation-reader-failure.json'
          out = {'run': os.environ['GITHUB_RUN_ID'], 'source': os.environ['EXPECTED_SOURCE'],
                 'scope': 'Complete proof unavailable or inadmissible; native job logs retained, no qualification.'}
          data = (json.dumps(out, indent=2) + '\n').encode()
          assert len(data) <= 65536
          p.write_bytes(data)
          DIAG
      - name: Preserve only the bounded diagnostic
        if: always() && steps.unit_proof.outputs.admissible != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-reader-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-reader-failure.json
          if-no-files-found: error
          retention-days: 1
