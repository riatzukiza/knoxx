# Isolated QA branch variant of registered ci.yml; no application CI credit.
name: Genuine SDK and checked entry compile (QA only)

on:
  workflow_dispatch:
    inputs:
      comparison_base_sha:
        description: Recorded product source SHA; this job compiles the pinned SDK entry only
        required: true
        type: string
      migration_infrastructure:
        description: Keep false; no product validation, model inference or migration runs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  real-sdk-compile-only:
    name: Genuine SDK and checked embedding compilation only
    if: ${{ github.repository_id == '1401249297' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out only this isolated QA source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # official v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require fresh selected worker metadata before tool installation
        env:
          PILOT_REPOSITORY: ${{ github.repository }}
          PILOT_REPOSITORY_ID: ${{ github.repository_id }}
          PILOT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          PILOT_EVENT: ${{ github.event_name }}
          PILOT_RUN_ID: ${{ github.run_id }}
          PILOT_RUN_ATTEMPT: ${{ github.run_attempt }}
          PILOT_JOB: ${{ github.job }}
          PILOT_SOURCE_SHA: ${{ github.sha }}
          PILOT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PILOT_WORKFLOW_REF: ${{ github.workflow_ref }}
          PILOT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PILOT_RUNNER_OS: ${{ runner.os }}
          PILOT_RUNNER_ARCH: ${{ runner.arch }}
          PILOT_ADAPTER_SHA256: b5860f799bd1e37fd61a8ae19038f1821de5172c9e7637085df5ea0a4fe912e4
          PILOT_COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha }}
          PILOT_MIGRATION_INFRASTRUCTURE: ${{ inputs.migration_infrastructure }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, runpy
          path = pathlib.Path('.github/qa/model-compatibility/metadata.py')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ['PILOT_ADAPTER_SHA256']
          value = runpy.run_path(str(path))
          assert value['result']['classification'] == 'METADATA_THRESHOLDS_MET'
          assert os.environ['PILOT_COMPARISON_BASE_SHA'] == '612488d4b01ba877d48beb66ac7b02ad448faa43'
          PY

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # official v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # official v5
        with:
          node-version: '24'

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # official v4
        with:
          version: 10.20.0
          run_install: false

      - name: Set up pinned Clojure CLI
        uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # official 13.4
        with:
          cli: '1.12.5.1654'
          clj-kondo: '2025.07.28'

      - name: Build genuine pinned SDK and compile isolated checked-provider entry
        shell: bash
        run: |
          set -euo pipefail
          set -C
          umask 077
          python3 .github/qa/model-compatibility/owned-process-supervisor.py \
            --timeout-ms 2700000 --max-output-bytes 65536 --cleanup-ms 10000 \
            -- python3 .github/qa/model-compatibility/build-only.py \
            > "$RUNNER_TEMP/sdk-build-owner-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" \
            2> "$RUNNER_TEMP/sdk-build-owner-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.stderr"
          python3 - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          stem = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          receipt = temp / ('sdk-build-owner-' + stem + '.json')
          stderr = temp / ('sdk-build-owner-' + stem + '.stderr')
          value = json.loads(receipt.read_bytes())
          assert not stderr.read_bytes()
          assert value['exit-code'] == 0 and value['termination'] == 'exited'
          assert value['cleanup-complete?'] and not value['capture-truncated?']
          run = temp / ('openhax-sdk-compile-' + stem)
          roots = [run / 'evidence', run / 'sdk/evidence']
          size = sum(p.stat().st_size for root in roots for p in root.rglob('*') if p.is_file())
          size += receipt.stat().st_size + stderr.stat().st_size
          size += (temp / ('hosted-worker-metadata-' + stem) / 'measurement.json').stat().st_size
          assert size <= 80 * 1024**2
          print(value['output'])
          PY

      - name: Preserve finite SDK and entry build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        with:
          name: genuine-sdk-entry-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openhax-sdk-compile-${{ github.run_id }}-${{ github.run_attempt }}/evidence
            ${{ runner.temp }}/openhax-sdk-compile-${{ github.run_id }}-${{ github.run_attempt }}/sdk/evidence
            ${{ runner.temp }}/hosted-worker-metadata-${{ github.run_id }}-${{ github.run_attempt }}/measurement.json
            ${{ runner.temp }}/sdk-build-owner-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/sdk-build-owner-${{ github.run_id }}-${{ github.run_attempt }}.stderr
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false
          include-hidden-files: false
