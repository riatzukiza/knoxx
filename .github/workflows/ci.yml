# SPDX-License-Identifier: GPL-3.0-or-later
name: One full baseline stdout timing on pinned CMS (QA only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-baseline-timing:
    name: One complete registered baseline with byte-preserving stdout timing
    if: ${{ github.repository_id == '1401249297' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the immutable application source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 13c81a13e1d4fc7772629ea257bbe1d41d8ec05c
          fetch-depth: 0
          persist-credentials: false
      - name: Bind actual source and worker before setup
        shell: bash
        run: |
          python3 - <<'PRE'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baseline-timing-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          proof.mkdir(mode=0o700)
          def read(args):
              r = subprocess.run(['git', '-C', str(root), *args], capture_output=True, timeout=30)
              assert r.returncode == 0 and not r.stderr
              return r.stdout
          head = read(['rev-parse', 'HEAD']).decode().strip()
          tree = read(['rev-parse', 'HEAD^{tree}']).decode().strip()
          status = read(['status', '--porcelain=v1', '-z', '--untracked-files=all'])
          assert head == '13c81a13e1d4fc7772629ea257bbe1d41d8ec05c'
          assert tree == 'd8809453e3fdd2b51900e24b991a4a3c596fb2de' and not status
          rows = {'AGENTS.md': {'bytes': 13198, 'sha256': 'a9aae6e9cc829df7319b267c8b93fa188abcc52a2c7e6e87c56846173f29701e'}, '.github/actions/knoxx-setup/action.yml': {'bytes': 3782, 'sha256': 'e659dbe3309c139c0afdc4f6a0c157bc02f8f0ab82100a2318df5bccbbd68b1f'}, 'backend/deps.edn': {'bytes': 3204, 'sha256': 'f602dbfa145df71642fb45f9945984303a0acd2b74baac42b05e8a7be4bddc76'}, 'backend/package.json': {'bytes': 3570, 'sha256': 'b33b47e00c0e50db074e2e8407c83d1f2f7706ac02ea0c100b251ab574753d90'}, 'backend/mutation/README.md': {'bytes': 1848, 'sha256': 'b09fe3379ede9eefa0ac238bc112ba470f2371d0fcda60fe9e4980b029fc7c4d'}, 'backend/mutation/knoxx/mutation_test.clj': {'bytes': 50310, 'sha256': 'e451de93d2663b7d5ecc588900483ef8e08be4845b89d1b9c22184f2701586a0'}, 'backend/mutation/reviewed-equivalents.edn': {'bytes': 1549, 'sha256': '9ab9e0368236e9d918e5c4d0092c05524c3a94cec6ae4e7c170e73cfe131d8d9'}, 'backend/scripts/run-mutation-process.py': {'bytes': 18518, 'sha256': '747b7dde9e480e9e5e9eee57985d66265c2cf0f2caf0341388cb10fc07303bbe'}, 'backend/scripts/run-mutation-tests.mjs': {'bytes': 773, 'sha256': '4a420d47ca177742ffbfbb1cdedc1f65450b4b9dcc2278d47b79dbfc4d425e0d'}, 'backend/scripts/shadow-test-environment.mjs': {'bytes': 781, 'sha256': '9cb72b8d1cafc7136b95e6d5241289b1ad388638fc5edb683279d1f28ef102a8'}, 'backend/shadow-cljs.edn': {'bytes': 9554, 'sha256': 'cb45b403d669710e33fabcf359af6d580548b9ebfa194a4d55e2c40a6cb08a51'}, '.github/workflows/deploy-production.yml': {'bytes': 7975, 'sha256': '8fe8a62967a1412541c7e17d8ccff997a7881a11941a290ff43ee978349e410b'}, 'backend/test/python/test_mutation_process.py': {'bytes': 26614, 'sha256': '1a793fe0b13201b0e70a15269044ed250f2fbe6aa774c74861de36f33ca490e8'}, 'backend/test/clj/knoxx/mutation_test_test.clj': {'bytes': 68973, 'sha256': '383b458de6505fe6e21e803b88e2f8d52832fad8dae6c5f8d3c737f45956d8ff'}, 'backend/test/cljs/knoxx/backend/extern/bootstrap_readiness_test.cljs': {'bytes': 15271, 'sha256': '439cc9f87679aeead1eb0ae4312cf8fc682fefdd5c916d5d064ef619a6976512'}}
          for relative, row in rows.items():
              data = (root / relative).read_bytes()
              assert len(data) == row['bytes'] and hashlib.sha256(data).hexdigest() == row['sha256']
          data = {'sourceHead': head, 'sourceTree': tree, 'workflowSHA': os.environ['GITHUB_SHA'],
                  'workflowRef': os.environ['GITHUB_WORKFLOW_REF'], 'run': os.environ['GITHUB_RUN_ID'],
                  'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'sourceRows': rows,
                  'worker': {'UID': os.getuid(), 'GID': os.getgid(), 'CPU': os.cpu_count(),
                             'meminfo': pathlib.Path('/proc/meminfo').read_text(),
                             'memoryPSI': pathlib.Path('/proc/pressure/memory').read_text()},
                  'limits': 'Read-only source and worker facts; no production or minimum-capacity claim.'}
          with (proof / 'pre-setup-source-and-worker.json').open('x') as stream: json.dump(data, stream, indent=2)
          PRE
      - name: Prepare the unchanged registered SDK and verification dependencies
        uses: ./.github/actions/knoxx-setup
      - name: Relocate only the closed setup source outside the clean application tree
        shell: bash
        run: |
          python3 - <<'SDK_SOURCE'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          stem = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          proof = temp / ('baseline-timing-' + stem)
          old = root / '_deps'
          new = temp / ('mutation-setup-source-' + stem)
          assert old.resolve(strict=True) == old and old.is_dir() and [p.name for p in old.iterdir()] == ['openplanner']
          assert not new.exists() and not new.is_symlink() and old.stat().st_dev == temp.stat().st_dev
          def observe(source):
              result = {}
              for label, args in [('head', ['rev-parse', 'HEAD']), ('tree', ['rev-parse', 'HEAD^{tree}']),
                                  ('status', ['status', '--porcelain=v1', '-z', '--untracked-files=all'])]:
                  native = subprocess.run(['git', '-C', str(source), *args], capture_output=True, timeout=30)
                  assert native.returncode == 0 and not native.stderr and len(native.stdout) <= 65536
                  result[label] = native.stdout.decode().strip()
              assert result == {'head': '07085d6557b75834ce6f50e6c54b8ca47e1c7c08',
                                'tree': '1dc69c04c8e832661d8062c15ee24a853f135d35', 'status': ''}
              value = source.stat(); result['inode'] = value.st_ino; result['device'] = value.st_dev
              return result
          before = observe(old / 'openplanner')
          os.rename(old, new)
          after = observe(new / 'openplanner')
          assert before == after and not old.exists()
          record = {'oldSetupParent': str(old), 'newSetupParent': str(new), 'before': before, 'after': after,
                    'scope': 'Same-filesystem rename of this job own completed setup source only; no ignore, deletion, reset or SDK helper/source edit. The built SDK sibling link and filtered build remain at their original paths.'}
          with (proof / 'sdk-setup-source-relocation.json').open('x') as stream: json.dump(record, stream, indent=2)
          status = subprocess.run(['git', '-C', str(root), 'status', '--porcelain=v1', '-z', '--untracked-files=all'], capture_output=True, timeout=30)
          assert status.returncode == 0 and not status.stderr and not status.stdout, 'Application must be clean before the canonical mutation harness.'
          SDK_SOURCE
      - name: Run the existing full registered Python process-custody suite
        shell: bash
        run: |
          set -euo pipefail
          set -C
          proof="$RUNNER_TEMP/baseline-timing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 backend/scripts/run-mutation-process.py \
            --timeout-ms 600000 --max-output-bytes 8388608 --cleanup-ms 30000 \
            -- python3 backend/test/python/test_mutation_process.py \
            > "$proof/registered-python-native.json" 2> "$proof/registered-python-adapter.stderr"
          python3 - <<'PYTHON_GATE'
          import hashlib, json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baseline-timing-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          native = json.loads((proof / 'registered-python-native.json').read_bytes())
          assert not (proof / 'registered-python-adapter.stderr').read_bytes()
          assert native['exit-code'] == 0 and native['termination'] == 'exited'
          assert native['cleanup-complete?'] and not native['capture-truncated?'] and not native['timed-out?']
          output = native['output'].encode()
          assert hashlib.sha256(output).hexdigest() == native['output-sha256']
          assert len(output) == native['captured-output-bytes']
          print(native['output'])
          PYTHON_GATE
      - name: Run the existing full registered mutation owning unit suite
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          set -C
          proof="$RUNNER_TEMP/baseline-timing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 scripts/run-mutation-process.py \
            --timeout-ms 600000 --max-output-bytes 8388608 --cleanup-ms 30000 \
            -- clojure -M:mutation-test \
            > "$proof/registered-unit-native.json" 2> "$proof/registered-unit-adapter.stderr"
          python3 - <<'UNIT_GATE'
          import hashlib, json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baseline-timing-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          native = json.loads((proof / 'registered-unit-native.json').read_bytes())
          assert not (proof / 'registered-unit-adapter.stderr').read_bytes()
          assert native['exit-code'] == 0 and native['termination'] == 'exited'
          assert native['cleanup-complete?'] and not native['capture-truncated?'] and not native['timed-out?']
          output = native['output'].encode()
          assert hashlib.sha256(output).hexdigest() == native['output-sha256']
          assert len(output) == native['captured-output-bytes']
          print(native['output'])
          UNIT_GATE
      - name: Materialize only the frozen QA helpers outside the application tree
        shell: bash
        run: |
          python3 - <<'HELPERS'
          import base64, hashlib, json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baseline-timing-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          assert proof.resolve(strict=True) == proof and proof.stat().st_uid == os.getuid() and os.getuid() != 0
          helpers = {'qa-stdout-timing-observer.mjs': ('', 'b3e0f807ece3d149517104cc102286e61f40f12db693aedd1434c0a4c45bf34b'),
                     'qa-one-full-baseline-timing-v2-terminal-cleanup.clj': ('', '7ca2b5a00ae7fdcd45c88960db5d5425acb3014bcebcbf907aa3c514278f6841')}
          rows = {}
          for name, (encoded, expected) in helpers.items():
              data = base64.b64decode(encoded, validate=True)
              assert hashlib.sha256(data).hexdigest() == expected
              path = proof / name
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, 'wb') as stream: stream.write(data)
              assert path.read_bytes() == data
              rows[name] = {'bytes': len(data), 'sha256': expected}
          with (proof / 'frozen-helper-custody.json').open('x') as stream: json.dump(rows, stream, indent=2)
          HELPERS
      - name: Run exactly one complete canonical baseline and observe stdout arrival times
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          set -C
          proof="$RUNNER_TEMP/baseline-timing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 scripts/run-mutation-process.py --timeout-ms 1200000 --max-output-bytes 8388608 --cleanup-ms 30000 \
            -- clojure -M "$proof/qa-one-full-baseline-timing-v2-terminal-cleanup.clj" \
            "$proof/qa-stdout-timing-observer.mjs" "$proof/node-stdout-profile" "$proof/baseline-timing.json" \
            > "$proof/canonical-baseline-native.json" 2> "$proof/canonical-baseline-adapter.stderr"
          python3 - <<'CHECK'
          import hashlib, json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baseline-timing-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          native = json.loads((proof / 'canonical-baseline-native.json').read_bytes())
          assert not (proof / 'canonical-baseline-adapter.stderr').read_bytes()
          assert native['exit-code'] == 0 and native['termination'] == 'exited'
          assert native['cleanup-complete?'] and not native['capture-truncated?'] and not native['timed-out?']
          output = native['output'].encode()
          assert len(output) == native['captured-output-bytes'] and hashlib.sha256(output).hexdigest() == native['output-sha256']
          report = json.loads((proof / 'baseline-timing.json').read_bytes())
          assert report['source'] == '13c81a13e1d4fc7772629ea257bbe1d41d8ec05c' and report['tree'] == 'd8809453e3fdd2b51900e24b991a4a3c596fb2de'
          assert report['diagnostic-complete'] and report['test-counters'] == {'tests': 2181, 'assertions': 12661, 'failures': 0, 'errors': 0, 'summaries': 1}
          profile = proof / 'node-stdout-profile'
          actual = json.loads((profile / 'outcome.json').read_bytes())
          raw = (profile / 'stdout.raw').read_bytes()
          assert actual['observationComplete'] and actual['stdoutDrained'] and not actual['diagnosticErrors'] and actual['spawnError'] is None
          assert actual['rawStdoutBytes'] == actual['observedStdoutBytes'] == len(raw) and hashlib.sha256(raw).hexdigest() == actual['rawStdoutSHA256']
          for name in ['exitEvent', 'closeEvent']:
              assert actual[name]['code'] == 0 and actual[name]['signal'] is None
          timing = (profile / 'stdout-chunk-arrivals.jsonl').read_bytes()
          rows = [json.loads(line) for line in timing.splitlines()]
          assert len(rows) == actual['timingRows'] and len(timing) == actual['timingBytes']
          chunks = [row for row in rows if row['kind'] == 'stdout-chunk-arrival']
          offset = 0
          for index, row in enumerate(chunks, 1):
              assert row['index'] == index and row['offset'] == offset and row['bytes'] > 0
              offset += row['bytes']
          assert offset == len(raw) and len(chunks) == actual['chunks']
          clocks = [int(row['atNS']) for row in rows]
          assert clocks == sorted(clocks) and rows[0]['kind'] == 'observer-start' and rows[-1]['kind'] == 'child-close-and-stdout-drained'
          # This raw file is child stdout only. Native output also includes inherited stderr; equality is not asserted between those channels.
          print(native['output'])
          CHECK
      - name: Preserve actual final source custody without resetting it
        if: always()
        shell: bash
        run: |
          python3 - <<'POST'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baseline-timing-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          proof.mkdir(mode=0o700, exist_ok=True)
          rows = {}
          for label, args in [('head', ['rev-parse', 'HEAD']), ('tree', ['rev-parse', 'HEAD^{tree}']),
                              ('status', ['status', '--porcelain=v1', '-z', '--untracked-files=all']),
                              ('index', ['diff', '--cached', '--raw', '-z']), ('diff', ['diff', 'HEAD', '--'])]:
              r = subprocess.run(['git', '-C', str(root), *args], capture_output=True, timeout=30)
              assert len(r.stdout) <= 1048576 and len(r.stderr) <= 65536
              for suffix, data in [('stdout', r.stdout), ('stderr', r.stderr)]:
                  with (proof / ('post-' + label + '.' + suffix)).open('xb') as stream: stream.write(data)
              rows[label] = {'exit': r.returncode, 'stdoutBytes': len(r.stdout),
                             'stdoutSHA256': hashlib.sha256(r.stdout).hexdigest(), 'stderrBytes': len(r.stderr)}
          clean = (all(row['exit'] == 0 and not row['stderrBytes'] for row in rows.values())
                   and (proof / 'post-head.stdout').read_text().strip() == '13c81a13e1d4fc7772629ea257bbe1d41d8ec05c'
                   and (proof / 'post-tree.stdout').read_text().strip() == 'd8809453e3fdd2b51900e24b991a4a3c596fb2de'
                   and all(rows[label]['stdoutBytes'] == 0 for label in ['status', 'index', 'diff']))
          with (proof / 'post-source-custody.json').open('x') as stream: json.dump({'actualClean': clean, 'nativeReads': rows}, stream, indent=2)
          assert clean, 'Canonical source did not restore; no reset or synthetic cleanup is performed.'
          POST
      - name: Bound complete reports and payload evidence even after failure
        id: evidence-size
        if: always()
        shell: bash
        run: |
          python3 - <<'SIZE'
          import hashlib, json, os, pathlib, stat, sys, time
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          stem = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          proof = temp / ('baseline-timing-' + stem)
          proof.mkdir(mode=0o700, exist_ok=True)
          roots = [proof, pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'backend/target/mutation-timing', temp / 'knoxx-setup-sdk/evidence']
          total = 0
          count = 0
          deadline = time.monotonic() + 60
          receipt = {'admissible': False, 'scope': 'One full baseline timing diagnostic only; zero mutation, kill, campaign or release credit.'}
          def traversal_error(error): raise error
          def paths(root):
              yield root
              for parent, dirs, files in os.walk(root, onerror=traversal_error, followlinks=False):
                  for leaf in dirs + files: yield pathlib.Path(parent) / leaf
          try:
              for root in roots:
                  if root.exists() or root.is_symlink():
                      for path in paths(root):
                          value = path.lstat()
                          assert stat.S_ISREG(value.st_mode) or stat.S_ISDIR(value.st_mode), 'Unexpected nonregular evidence node'
                          if stat.S_ISREG(value.st_mode): count += 1; total += value.st_size
                          assert time.monotonic() <= deadline and count <= 50000
              receipt['admissible'] = total + 65536 <= 256 * 1024**2
              assert receipt['admissible'], 'Complete baseline timing proof exceeds256MiB including receipt reserve'
          except BaseException as error:
              receipt['admissible'] = False
              receipt['artifactFailure'] = {'type': type(error).__name__, 'message': str(error)[:1000]}
          receipt.update({'rawBytes': total, 'regularFiles': count})
          native_path = proof / 'canonical-baseline-native.json'
          if native_path.is_file() and not native_path.is_symlink() and native_path.stat().st_size <= 16 * 1024**2:
              raw = native_path.read_bytes(); receipt['nativeCaptureSHA256'] = hashlib.sha256(raw).hexdigest()
              try:
                  native = json.loads(raw)
                  receipt['native'] = {key: native.get(key) for key in ['exit-code', 'termination', 'cleanup-complete?', 'capture-truncated?', 'diagnostic']}
              except ValueError: receipt['native'] = 'Unavailable; original capture hash retained.'
          if not receipt['admissible']: receipt['limit'] = 'Complete proof omitted; finite diagnostic only, no qualification.'
          data = (json.dumps(receipt, indent=2) + '\n').encode(); assert len(data) <= 65536
          path = temp / ('mutation-artifact-size-' + stem + '.json')
          with path.open('xb') as stream: stream.write(data)
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as stream: stream.write('admissible=' + str(receipt['admissible']).lower() + '\n')
          print(data.decode()); sys.exit(0 if receipt['admissible'] else 1)
          SIZE
      - name: Preserve complete canonical baseline timing evidence
        if: ${{ always() && steps.evidence-size.outputs.admissible == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genuine-three-baseline-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/baseline-timing-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ github.workspace }}/backend/target/mutation-timing
            ${{ runner.temp }}/knoxx-setup-sdk/evidence
            ${{ runner.temp }}/mutation-artifact-size-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false
          include-hidden-files: true
      - name: Preserve a finite evidence-bound failure diagnostic
        if: ${{ always() && steps.evidence-size.outputs.admissible == 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-timing-evidence-bound-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-artifact-size-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false
