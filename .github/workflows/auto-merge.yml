name: Auto Merge

on:
  pull_request:
    types: [opened, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: open-hax/eta-mu/.github/workflows/auto-merge.yml@f4ac84be690fb6cfc7bf8fbd27b62d1befaaaee8 # eta-mu main, 2026-08-02
    with:
      pr: ${{ github.event.pull_request.number }}
      merge-method: SQUASH
    secrets:
      ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
      ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
