name: Review Resolution Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-gate:
    uses: open-hax/eta-mu/.github/workflows/review-resolution-gate.yml@f4ac84be690fb6cfc7bf8fbd27b62d1befaaaee8 # eta-mu main, 2026-08-02
    with:
      pr: ${{ github.event.pull_request.number }}
      strict: true
    secrets:
      ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
      ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
